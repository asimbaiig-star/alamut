<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Alamut for creators — get booked by brands at your rates</title>
    <meta name="description" content="Build a storefront with your work, channels and packages. Apply to brand briefs or get offers directly, and get paid post by post. Free to join. Public beta — payments are simulated." />
    <link rel="canonical" href="https://alamut-six.vercel.app/" />
    <!-- F35 — favicon. Inline SVG data URI so there's no binary asset to
         keep in sync with the brand; #b55f40 is the resolved value of the
         terracotta accent token (oklch(0.58 0.12 40)). -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b55f40'/%3E%3Cpath d='M16 7.5 L23.5 24.5 H19.6 L16 15.6 L12.4 24.5 H8.5 Z' fill='%23FBF7EE'/%3E%3C/svg%3E"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alamut" />
    <meta property="og:title" content="Alamut — get booked by brands, at your rates" />
    <meta property="og:description" content="A storefront brands can brief you from, briefs you can pitch, and payment held before you start. Free to join. Public beta — payments are simulated." />
    <meta property="og:url" content="https://alamut-six.vercel.app/" />
    <meta property="og:image" content="https://alamut-six.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://alamut-six.vercel.app/og-image.jpg" />
    <meta name="twitter:title" content="Alamut — get booked by brands, at your rates" />
    <meta name="twitter:description" content="A storefront brands can brief you from, briefs you can pitch, and payment held before you start. Free to join. Public beta — payments are simulated." />
    <!-- Landing type: one family, Archivo. Condensed and heavy for headlines
         and prices, normal width for text. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap" />
    <!-- Hero entrance (landing.css, "Motion"): on only in a visible tab and
         without reduced motion, decided before first paint so nothing flashes. -->
    <script>if(document.visibilityState==='visible'&&!matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('lx-anim')</script>
  </head>
  <body style="margin:0;background:#fff">
    <div id="lx-root" data-page="creators"><!--lx-ssr--></div>
    <script type="module" src="/src/landing/entry-client.tsx"></script>
  </body>
</html>
