<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Alamut for brands — find creators and get pitched</title>
    <meta name="description" content="Browse creator storefronts with published rates, or post a brief and let creators pitch you. Then run the whole deal in one place. Free to post. Public beta, payments are simulated." />
    <link rel="canonical" href="https://alamut-six.vercel.app/for-brands" />
    <!-- F35 — favicon. Inline SVG data URI so there's no binary asset to
         keep in sync with the brand; #d42a22 is the landing's record red
         (src/landing/landing.css --rec). -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d42a22'/%3E%3Cpath d='M16 7.5 L23.5 24.5 H19.6 L16 15.6 L12.4 24.5 H8.5 Z' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <meta name="theme-color" content="#14151c" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alamut" />
    <meta property="og:title" content="Alamut for brands — find creators, get pitched" />
    <meta property="og:description" content="The marketplace for creator deals, and the place you run them. Free to post. Public beta, payments are simulated." />
    <meta property="og:url" content="https://alamut-six.vercel.app/for-brands" />
    <meta property="og:image" content="https://alamut-six.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://alamut-six.vercel.app/og-image.jpg" />
    <meta name="twitter:title" content="Alamut for brands — find creators, get pitched" />
    <meta name="twitter:description" content="The marketplace for creator deals, and the place you run them. Free to post. Public beta, payments are simulated." />
    <!-- Landing type: one family, Archivo. Condensed and heavy for headlines
         and prices, normal width for text. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,400..900&display=swap" />
    <!-- Hero entrance (landing.css, "Motion"): on only in a visible tab and
         without reduced motion, decided before first paint so nothing flashes. -->
    <script>if(document.visibilityState==='visible'&&!matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('lx-anim')</script>
  </head>
  <body style="margin:0;background:#14151c">
    <div id="lx-root" data-page="brands"><!--lx-ssr--></div>
    <script type="module" src="/src/landing/entry-client.tsx"></script>
  </body>
</html>
