<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Alamut og:image, 1200x630. Rendered with sips against temporarily
       installed copies of the REAL brand fonts (family names "Fraunces
       SemiBold" / "Switzer Medium") — sips only honours installed fonts and
       ignores @font-face, and qlmanage's WebKit path scales the viewport,
       so this is the only route to correct fonts at exact pixel size.
       Headline widths were measured in-browser with the real face loaded:
       82px gives 736px / 832px against 1056px of usable width. -->
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBF7EE"/>
      <stop offset="55%" stop-color="#F7EFE2"/>
      <stop offset="100%" stop-color="#F1E4D4"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.12" cy="0.08" r="0.58">
      <stop offset="0%" stop-color="#b55f40" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#b55f40" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#warm)"/>
  <rect width="1200" height="630" fill="url(#halo)"/>

  <!-- Logo tile + 'A' (same glyph as the favicon) -->
  <rect x="72" y="70" width="64" height="64" rx="15" fill="#b55f40"/>
  <path d="M104 83 L118.5 119 H111.6 L104 100 L96.4 119 H89.5 Z" fill="#FBF7EE"/>

  <text x="152" y="106" font-family="Fraunces SemiBold" font-size="34"
        fill="#1a1714" letter-spacing="-0.5">Alamut</text>
  <text x="152" y="128" font-family="Switzer Medium" font-size="12.5"
        fill="#8a7f72" letter-spacing="3.2">CREATOR — BRAND MARKETPLACE</text>

  <!-- Headline -->
  <text x="72" y="292" font-family="Fraunces SemiBold" font-size="82"
        fill="#1a1714" letter-spacing="-2.2">The operating system</text>
  <text x="72" y="377" font-family="Fraunces SemiBold" font-size="82"
        fill="#b55f40" letter-spacing="-2.2">for the creator economy.</text>

  <!-- Supporting copy -->
  <text x="72" y="449" font-family="Switzer Medium" font-size="25" fill="#5c5349">Briefs, negotiation, delivery and escrow — every creator</text>
  <text x="72" y="485" font-family="Switzer Medium" font-size="25" fill="#5c5349">deal, tracked end to end.</text>

  <!-- Footer -->
  <rect x="72" y="538" width="1056" height="1" fill="#1a1714" opacity="0.12"/>
  <text x="72" y="577" font-family="Switzer Medium" font-size="19" fill="#1a1714">alamut-six.vercel.app</text>
  <rect x="922" y="554" width="206" height="34" rx="17" fill="#b55f40" opacity="0.12"/>
  <text x="1025" y="576" text-anchor="middle" font-family="Switzer Medium"
        font-size="14.5" fill="#9a4f34" letter-spacing="0.4">PUBLIC BETA</text>
</svg>
