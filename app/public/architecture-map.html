<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Alamut · Architecture Map</title>
<style>
  :root {
    --bg:#0F0F0F; --panel:#161616; --panel-2:#1c1c1c; --border:#2a2a2a;
    --text:#e8e8e8; --muted:#8a8a8a;
    --client:#4ea1ff; --route:#7bd389; --service:#c792ea; --db:#ffb86b;
    --external:#ff6b9d; --critical:#ff3860; --accent:#f5b942; --accent-2:#ff7a45;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--text);
    font:13px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  #app { display:grid; grid-template-columns: 1fr 380px; height:100vh; }
  #canvas-wrap { position:relative; overflow:hidden; background:
    radial-gradient(ellipse at 20% 10%, #14181d 0%, #0f0f0f 60%) no-repeat; }
  #canvas { width:100%; height:100%; cursor:grab; user-select:none; }
  #canvas.dragging { cursor:grabbing; }
  #side { background:var(--panel); border-left:1px solid var(--border); overflow-y:auto;
    padding:18px 20px 36px; }
  /* Top toolbar */
  #toolbar { position:absolute; top:14px; left:14px; right:14px; display:flex;
    flex-wrap:wrap; gap:8px; align-items:center; pointer-events:none; }
  #toolbar > * { pointer-events:auto; }
  .chip { padding:5px 11px; border-radius:999px; font-size:12px;
    background:rgba(28,28,28,0.85); color:var(--text); border:1px solid var(--border);
    cursor:pointer; backdrop-filter: blur(6px); transition: background .15s, border-color .15s; }
  .chip:hover { background:#1f2329; border-color:#3a3a3a; }
  .chip.active { background:#2a2f37; border-color:#4ea1ff; color:#cfe6ff; }
  .chip.danger.active { border-color:#ff3860; color:#ffd4d4; }
  .legend { margin-left:auto; display:flex; gap:12px; align-items:center;
    background:rgba(22,22,22,0.85); border:1px solid var(--border); padding:5px 12px;
    border-radius:10px; font-size:11px; color:var(--muted); backdrop-filter: blur(6px); }
  .legend .sw { display:inline-block; width:10px; height:10px; border-radius:2px;
    vertical-align:middle; margin-right:4px; }
  /* Zoom controls */
  #zoom { position:absolute; bottom:14px; left:14px; display:flex; gap:6px; }
  .zbtn { width:30px; height:30px; border-radius:6px; background:rgba(22,22,22,0.85);
    border:1px solid var(--border); color:var(--text); cursor:pointer; font-size:14px;
    line-height:1; backdrop-filter: blur(6px); }
  .zbtn:hover { background:#1f2329; }
  /* SVG node styling */
  .node rect { fill:var(--panel-2); stroke-width:1.4; transition: opacity .18s; }
  .node.crit rect { stroke-width:2.4; }
  .node text.label { font-size:13px; font-weight:600; fill:var(--text); pointer-events:none; }
  .node text.sub { font-size:11px; fill:var(--muted); pointer-events:none; }
  .node { cursor:pointer; }
  .node:hover rect { fill:#22272d; }
  .node.selected rect { fill:#262d36; }
  .node.dim rect, .node.dim text { opacity:0.18; }
  .edge { fill:none; stroke-width:1.3; pointer-events:none; transition: opacity .18s; }
  .edge.dim { opacity:0.07; }
  .edge.k-critical { stroke:var(--critical); stroke-width:1.8; }
  .edge.k-api      { stroke:var(--accent-2); }
  .edge.k-db       { stroke:var(--db); stroke-dasharray:4 3; }
  .edge.k-mount    { stroke:var(--client); }
  .edge.k-normal   { stroke:#5a6068; }
  .edge-hit { stroke:transparent; stroke-width:14; fill:none; cursor:pointer; pointer-events:all; }
  .edge-label { font-size:10px; fill:var(--muted); pointer-events:none;
    paint-order:stroke; stroke:#0f0f0f; stroke-width:3; }
  .cluster rect { fill:#13161a; stroke:#1f242a; stroke-width:1; }
  .cluster text { fill:#5a6068; font-size:11px; font-weight:600;
    text-transform:uppercase; letter-spacing:.16em; }
  .badge { pointer-events:none; }
  .badge text { font-size:9px; font-weight:700; fill:#0f0f0f; text-anchor:middle; }
  /* Sidebar */
  #side h2 { margin:0 0 6px; font-size:15px; font-weight:600; }
  #side h3 { margin:18px 0 6px; font-size:11px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.14em; font-weight:600; }
  #side .pill { display:inline-block; font-size:10px; padding:2px 8px; border-radius:999px;
    background:#22272d; color:#cfe6ff; margin-right:6px; vertical-align:middle; }
  #side .pill.crit { background:#3a1218; color:#ffb6b6; }
  #side .path { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11.5px; color:#9ec6ff; word-break:break-all; }
  #side .role { color:var(--text); margin:6px 0 4px; }
  #side .plain { color:#cfd2d7; background:#13161a; border-left:2px solid #4ea1ff;
    padding:8px 10px; border-radius:4px; margin:4px 0 8px; font-size:12.5px; }
  #side ul { margin:4px 0 0; padding-left:18px; }
  #side ul li { margin:3px 0; color:#cdd0d4; font-size:12px; }
  #side .edges-list { font-size:12px; color:#cdd0d4; }
  #side .edges-list .e { padding:5px 0; border-bottom:1px solid #1f242a; }
  #side .edges-list .e:last-child { border-bottom:none; }
  #side .edges-list b { color:var(--text); font-weight:500; }
  #side .findings { background:#13161a; border:1px solid #1f242a; border-radius:6px;
    padding:12px 14px; }
  #side .findings .item { padding:10px 0; border-bottom:1px solid #1f242a; }
  #side .findings .item:last-child { border-bottom:none; }
  #side .findings .item b { color:#f5b942; font-weight:600; }
  #side .findings .item p { margin:4px 0 0; color:#cdd0d4; font-size:12px; }
  #side .bug, #side .fix { padding:6px 8px; border-radius:4px; margin:4px 0; font-size:11.5px; }
  #side .bug { background:#2a1218; color:#ffc4c4; border-left:2px solid #ff3860; }
  #side .fix { background:#16241a; color:#cce4cf; border-left:2px solid #58c08e; }
  #side .bug .sev { font-weight:700; text-transform:uppercase; font-size:9px;
    letter-spacing:.1em; margin-right:6px; }
  #side a.code { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11px; color:#9ec6ff; text-decoration:none; }
  /* Title block */
  #title { position:absolute; top:14px; left:14px; padding:8px 14px;
    background:rgba(22,22,22,0.85); border:1px solid var(--border); border-radius:8px;
    backdrop-filter: blur(6px); pointer-events:auto; display:flex; flex-direction:column; gap:1px; }
  #title b { font-size:13px; }
  #title span { font-size:10.5px; color:var(--muted); }
</style>
</head>

const KNOWN_BUGS = {
  'v2-verify-channel':    [{sev:'med', ref:'v2CreatorActions.ts:216',
                            t:'Still 100% mock — flips Platform.verified flag with no real OAuth handshake'}],
  'connect-platform':     [{sev:'low', ref:'connectPlatform.ts',
                            t:'Wired but no caller — ConnectPlatformModal still routes to v2VerifyChannel'}],

                            t:'Each platform needs dev-portal app registration + secret env vars before it works'}],

                            t:'INSERT policy is permissive (any auth\'d session) — user A spamming user B is possible at the prototype tier'}],
  'spark-engine':         [{sev:'low', ref:'sparkEngine.ts',
                            t:'Scripted only — no real LLM call. Production would replace with an agent loop.'}],
  'workspace-v2':         [{sev:'low', ref:'AdminQueueUnified.tsx:15',
                            t:'Stale narrative comment references pre-v2 DealActionBanner (deleted in audit slice-7)'}],

/* ====================================================================
 * RENDER
 * ==================================================================== */
const svg = document.getElementById('canvas');
const NS = 'http://www.w3.org/2000/svg';
const side = document.getElementById('side');

const COLOR = {
  client:'#4ea1ff', state:'#7bd389', service:'#c792ea',
  accent:'#f5b942', db:'#ffb86b', external:'#ff6b9d',
  route:'#7bd389',
};
const KIND_COLOR = {
  critical:'#ff3860', api:'#ff7a45', db:'#ffb86b', mount:'#4ea1ff', normal:'#5a6068',
};

function el(tag, attrs={}, parent=null) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

/* root group with pan/zoom */
const root = el('g', { id:'root' }, svg);

/* defs: arrow markers */
const defs = el('defs', {}, svg);
['critical','api','db','mount','normal'].forEach(k => {
  const m = el('marker', {
    id:`arr-${k}`, viewBox:'0 0 10 10', refX:'9', refY:'5',
    markerUnits:'userSpaceOnUse', markerWidth:'8', markerHeight:'8', orient:'auto',
  }, defs);
  el('path', { d:'M 0 0 L 10 5 L 0 10 z', fill:KIND_COLOR[k] }, m);
});

/* Cluster boxes */
clusters.forEach(c => {
  const g = el('g', { class:'cluster' }, root);
  el('rect', { x:c.x, y:c.y, width:c.w, height:c.h, rx:10 }, g);
  el('text', { x:c.x + 16, y:c.y + 22 }, g).textContent = c.label;
});

/* Edges */
function edgePath(a, b) {
  const x1 = a.x + a.w, y1 = a.y + a.h/2;
  const x2 = b.x,       y2 = b.y + b.h/2;
  const dx = Math.max(40, (x2 - x1) * 0.5);
  // route backward if needed
  if (x2 < x1) {
    const cx1 = x1 + 60, cx2 = x2 - 60;
    return { d:`M ${x1} ${y1} C ${cx1} ${y1}, ${cx2} ${y2}, ${x2} ${y2}`, lx:(x1+x2)/2, ly:(y1+y2)/2 };
  }
  const cx1 = x1 + dx, cx2 = x2 - dx;
  return { d:`M ${x1} ${y1} C ${cx1} ${y1}, ${cx2} ${y2}, ${x2} ${y2}`, lx:(x1+x2)/2, ly:(y1+y2)/2 - 4 };
}

const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));
const edgeEls = [];
const edgeLabelEls = [];

const edgesLayer = el('g', { id:'edges' }, root);
edges.forEach((e, i) => {
  const a = nodeById[e.from], b = nodeById[e.to];
  if (!a || !b) { console.warn('missing edge endpoint', e); return; }
  const { d, lx, ly } = edgePath(a, b);
  const path = el('path', {
    d, class:`edge k-${e.kind}`, 'marker-end':`url(#arr-${e.kind})`,
    'data-from':e.from, 'data-to':e.to, 'data-tag':(e.tag||['all']).join(','),
  }, edgesLayer);
  edgeEls.push(path);
  // hit area for hover
  el('path', { d, class:'edge-hit' }, edgesLayer);
  // label
  if (e.label) {
    const t = el('text', { x:lx, y:ly, class:'edge-label', 'text-anchor':'middle', 'data-tag':(e.tag||['all']).join(',') }, edgesLayer);
    t.textContent = e.label;
    edgeLabelEls.push(t);
  } else {
    edgeLabelEls.push(null);
  }
});

/* Nodes */
const nodesLayer = el('g', { id:'nodes' }, root);
const nodeEls = {};
nodes.forEach(n => {
  const g = el('g', {
    class:'node' + (n.critical ? ' crit' : ''),
    'data-id':n.id, 'data-tag':(n.tag||['all']).join(','),
    transform:`translate(${n.x},${n.y})`,
  }, nodesLayer);
  el('rect', { width:n.w, height:n.h, rx:8, stroke:COLOR[n.color] || '#888' }, g);
  const labelTxt = el('text', { class:'label', x:14, y:22 }, g);
  labelTxt.textContent = n.label;
  if (n.sub) {
    const subTxt = el('text', { class:'sub', x:14, y:n.h - 12 }, g);
    subTxt.textContent = n.sub;
  }
  // badges
  const fixes = (FIXES[n.id] || []).length;
  const bugs  = (KNOWN_BUGS[n.id] || []).length;
  if (fixes) {
    const bg = el('g', { class:'badge', transform:`translate(${n.w - 18},10)` }, g);
    el('circle', { r:8, fill:'#58c08e' }, bg);
    el('text', { x:0, y:3 }, bg).textContent = String(fixes);
  }
  if (bugs) {
    const bg = el('g', { class:'badge', transform:`translate(${n.w - (fixes ? 38 : 18)},10)` }, g);
    el('circle', { r:8, fill:'#ff3860' }, bg);
    el('text', { x:0, y:3 }, bg).textContent = String(bugs);
  }
  g.addEventListener('click', (ev) => { ev.stopPropagation(); selectNode(n.id); });
  g.addEventListener('mouseenter', () => { if (!selected) renderSidebar(n.id); });
  g.addEventListener('mouseleave', () => { if (!selected) renderSidebar(null); });
  nodeEls[n.id] = g;
});

/* ====================================================================
 * SELECTION + FILTER
 * ==================================================================== */
let activeFilter = 'overview';
let selected = null;

function applyFilter() {
  const f = activeFilter;
  const isRoadmap = f === 'roadmap';
  nodes.forEach(n => {
    const tags = (n.tag || ['all']);
    const hasBadge = (FIXES[n.id] || KNOWN_BUGS[n.id]) ? true : false;
    let visible;
    if (isRoadmap) visible = hasBadge;
    else visible = tags.includes(f) || (f === 'all');
    nodeEls[n.id].classList.toggle('dim', !visible);
  });
  edges.forEach((e, i) => {
    const tags = (e.tag || ['all']);
    const a = nodeById[e.from], b = nodeById[e.to];
    const aBadge = !!(FIXES[a?.id] || KNOWN_BUGS[a?.id]);
    const bBadge = !!(FIXES[b?.id] || KNOWN_BUGS[b?.id]);
    let visible;
    if (isRoadmap) visible = aBadge && bBadge;
    else visible = tags.includes(f) || (f === 'all');
    edgeEls[i].classList.toggle('dim', !visible);
    if (edgeLabelEls[i]) edgeLabelEls[i].style.opacity = visible ? '' : '0';
  });
}

function selectNode(id) {
  selected = id;
  // Compute connected set
  const conn = new Set([id]);
  edges.forEach(e => { if (e.from === id) conn.add(e.to); if (e.to === id) conn.add(e.from); });
  nodes.forEach(n => {
    nodeEls[n.id].classList.toggle('selected', n.id === id);
    nodeEls[n.id].classList.toggle('dim', !conn.has(n.id));
  });
  edges.forEach((e, i) => {
    const on = e.from === id || e.to === id;
    edgeEls[i].classList.toggle('dim', !on);
    if (edgeLabelEls[i]) edgeLabelEls[i].style.opacity = on ? '' : '0';
  });
  renderSidebar(id);
}

function clearSelection() {
  selected = null;
  nodes.forEach(n => {
    nodeEls[n.id].classList.remove('selected');
    nodeEls[n.id].classList.remove('dim');
  });
  edges.forEach((e, i) => {
    edgeEls[i].classList.remove('dim');
    if (edgeLabelEls[i]) edgeLabelEls[i].style.opacity = '';
  });
  applyFilter();
  renderSidebar(null);
}

/* ====================================================================
 * SIDEBAR
 * ==================================================================== */
function renderSidebar(id) {

    side.innerHTML = `
      <h2>Alamut · architecture map</h2>
      <p style="color:var(--muted);font-size:12px;margin:4px 0 14px">
        React + Vite + Zustand + Supabase. Brand × creator marketplace prototype.
        Click a node for details. Hover for a peek.
      </p>
      <h3>Notable findings from this map</h3>
      <div class="findings">
        <div class="item"><b>Critical seam:</b><p>
          The brand→creator workflow flows through one spine: <i>SendOfferModal → v2SendOffer → tx() → offersRepo → Postgres → Supabase Realtime → realtimeWorkflow → store</i>.
          Every other workflow mutation (apply / submit / approve / mark-live) takes the same shape. Break tx() and you break everything.
        </p></div>
        <div class="item"><b>Two stage-computation paths must stay in lockstep:</b><p>
          <code>deriveCollab</code> (read side, v2Adapters.ts:520) and <code>computeCollabStage</code> (write side, collabSync.ts:42)
          have to agree on what counts as "live" / "paid" or the kanban diverges from the persisted collab row.
          Slice-1 of the audit verified parity.
        </p></div>
        <div class="item"><b>Hot path: pushNotification fires from 25+ call sites</b><p>
          One helper (<code>client.ts:39</code>) drops into <code>db.notifications</code>, then queueMicrotask-mirrors to Supabase.
          A bug here ripples to every offer sent, application submitted, content approved, etc.
        </p></div>
        <div class="item"><b>Mock surface still in production:</b><p>
          <code>v2VerifyChannel</code> just flips a boolean. Real OAuth is scaffolded
          (<code>connectPlatform.ts</code> + <code>oauth-callback</code> Edge Function) but no caller wires it yet.
          Each platform needs dev-portal app registration first.
        </p></div>
        <div class="item"><b>Realtime cohort grew this session:</b><p>
          Was 2 tables (threads + messages, Phase 10). Now 9: + 6 workflow tables (Phase 22) + notifications (Phase 23).
          Out-of-order broadcasts protected by version-aware overlay in <code>realtimeWorkflow.ts</code>.
        </p></div>
        <div class="item"><b>Spark engine is scripted, not LLM-backed:</b><p>
          <code>sparkEngine.ts</code> returns pre-baked branches. No model is called. Naming suggests AI
          but the demo runs entirely client-side.
        </p></div>
        <div class="item"><b>No dead exports surfaced:</b><p>
          Every top-level export in <code>v2CampaignActions / v2CreatorActions / v2CollabActions / v2DisputeActions</code>
          has a live caller. Slice-7 of the audit deleted the last 3 orphan files (DealActionBanner, TodayQueue, TodayDealRow).
        </p></div>
      </div>
      <h3>How to read</h3>
      <p style="color:#cdd0d4;font-size:12px;margin:4px 0">
        <span class="pill crit">red</span> = critical spine.
        Edges flow left-to-right for writes, right-to-left for reads.
        Click a node to dim everything not connected to it.
        Toggle the chips at top to filter by feature.
      </p>
    `;
    return;
  }
  const n = nodeById[id];
  if (!n) { side.innerHTML = ''; return; }
  const inc = edges.filter(e => e.to === id);
  const out = edges.filter(e => e.from === id);
  const fixes = FIXES[id] || [];
  const bugs  = KNOWN_BUGS[id] || [];

  side.innerHTML = `
    <h2>${escapeHtml(n.label)}</h2>
    <div>
      ${n.critical ? '<span class="pill crit">critical</span>' : ''}
      <span class="pill">${n.cluster}</span>
      ${(n.tag || []).filter(t => t !== 'all').map(t => `<span class="pill" style="background:#1f242a;color:#9ec6ff">${escapeHtml(t)}</span>`).join('')}
    </div>
    <p class="role">${escapeHtml(n.role || '')}</p>
    ${n.plain ? `<div class="plain">${escapeHtml(n.plain)}</div>` : ''}
    ${n.path ? `<div class="path">${escapeHtml(n.path)}</div>` : ''}
    ${n.notes && n.notes.length ? `<h3>Notes</h3><ul>${n.notes.map(x => `<li>${escapeHtml(x)}</li>`).join('')}</ul>` : ''}
    ${fixes.length ? `<h3>Fixes shipped</h3>${fixes.map(f => `<div class="fix">#${f.n} · ${escapeHtml(f.t)}</div>`).join('')}` : ''}
    ${bugs.length ? `<h3>Known issues</h3>${bugs.map(b => `<div class="bug"><span class="sev">${b.sev}</span>${b.ref ? `<a class="code">${escapeHtml(b.ref)}</a> · ` : ''}${escapeHtml(b.t)}</div>`).join('')}` : ''}
    ${inc.length ? `<h3>Incoming (${inc.length})</h3><div class="edges-list">${inc.map(e => `<div class="e">← <b>${escapeHtml(nodeById[e.from]?.label || e.from)}</b> · ${escapeHtml(e.label || e.kind)}</div>`).join('')}</div>` : ''}
    ${out.length ? `<h3>Outgoing (${out.length})</h3><div class="edges-list">${out.map(e => `<div class="e">→ <b>${escapeHtml(nodeById[e.to]?.label || e.to)}</b> · ${escapeHtml(e.label || e.kind)}</div>`).join('')}</div>` : ''}
  `;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* ====================================================================
 * PAN + ZOOM
 * ==================================================================== */
let tx = 30, ty = 30, scale = 0.7;

function applyTransform() {
  root.setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`);
}
applyTransform();

const wrap = document.getElementById('canvas-wrap');
let dragging = false, lastX = 0, lastY = 0;
svg.addEventListener('mousedown', (ev) => {
  if (ev.target === svg || ev.target.tagName === 'svg' || ev.target.id === 'root') {
    clearSelection();
  }
  dragging = true;
  lastX = ev.clientX; lastY = ev.clientY;
  svg.classList.add('dragging');
});
window.addEventListener('mousemove', (ev) => {
  if (!dragging) return;
  tx += (ev.clientX - lastX);
  ty += (ev.clientY - lastY);
  lastX = ev.clientX; lastY = ev.clientY;
  applyTransform();
});
window.addEventListener('mouseup', () => {
  dragging = false; svg.classList.remove('dragging');
});

svg.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  const rect = svg.getBoundingClientRect();
  const mx = ev.clientX - rect.left;
  const my = ev.clientY - rect.top;
  const factor = Math.exp(-ev.deltaY * 0.0015);
  const next = Math.max(0.18, Math.min(2.5, scale * factor));
  // anchor zoom to cursor
  tx = mx - (mx - tx) * (next / scale);
  ty = my - (my - ty) * (next / scale);
  scale = next;
  applyTransform();
}, { passive:false });

document.getElementById('zin').onclick = () => {
  scale = Math.min(2.5, scale * 1.2); applyTransform();
};
document.getElementById('zout').onclick = () => {
  scale = Math.max(0.18, scale / 1.2); applyTransform();
};
document.getElementById('zfit').onclick = () => {
  const rect = svg.getBoundingClientRect();
  const W = 2080, H = 1700;
  const sx = rect.width / W, sy = rect.height / H;
  scale = Math.min(sx, sy) * 0.96;
  tx = (rect.width  - W * scale) / 2;
  ty = (rect.height - H * scale) / 2;
  applyTransform();
};

/* canvas size */
function fitInitial() {
  const rect = svg.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${rect.width} ${rect.height}`);
  document.getElementById('zfit').click();
}
fitInitial();
window.addEventListener('resize', () => {
  const rect = svg.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${rect.width} ${rect.height}`);
});

/* Filter chip handlers */
document.querySelectorAll('.chip[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.chip[data-filter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    if (selected) clearSelection();
    applyFilter();
  });
});

/* Initial render */
renderSidebar(null);
applyFilter();
</script>
